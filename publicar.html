<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abertura de O.S - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f8fafc; 
            --text-main: #1e293b; --text-secondary: #64748b; --border: #e2e8f0;
            --danger: #ef4444; --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding-top: 80px; padding-bottom: 40px; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 64px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; z-index: 1000; box-sizing: border-box; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--primary); font-size: 1.25rem; }
        .back-link { text-decoration: none; color: var(--text-secondary); font-size: 0.875rem; font-weight: 600; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        .card-style { background: white; border-radius: 12px; box-shadow: var(--card-shadow); border: 1px solid var(--border); padding: 24px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .custom-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: #fff; box-sizing: border-box; font-family: 'Inter', sans-serif;}
        .custom-input:focus { border-color: var(--primary); outline: none; }
        textarea.custom-input { resize: vertical; min-height: 80px; margin-bottom: 20px; }
        .btn-primary { background-color: var(--primary); color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn-cancel { background-color: #94a3b8; margin-top: 10px; }
        .btn-secondary { background-color: white; color: var(--primary); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin: 0 auto; display: block; }
        
        /* Estilos do Filtro */
        .filter-bar { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; background: white; padding: 15px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
        .filter-bar .custom-input { flex: 1; min-width: 200px; margin-bottom: 0; }
        .filter-bar .btn-filter { width: auto; padding: 10px 20px; margin: 0; }
        @media (max-width: 600px) { .filter-bar { flex-direction: column; } .filter-bar .btn-filter, .filter-bar .custom-input { width: 100%; } }
        
        .grid-os { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; margin-top: 10px;}
        .item-card { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 15px; display: flex; flex-direction: column; }
        .item-card h4 { margin: 0 0 5px 0; font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .item-card p { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-secondary); }
        .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid #f1f5f9; }
        .action-btn { flex: 1; padding: 6px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .btn-edit { background: #eff6ff; color: var(--primary); }
        .btn-delete { background: #fef2f2; color: var(--danger); }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-bottom: 10px; }
        .badge-pendente { background: #fef3c7; color: #b45309; }
        .badge-concluida { background: #dcfce7; color: #166534; }
        #status { font-weight: 600; margin-top: 15px; font-size: 0.9rem; text-align: center; min-height: 20px;}
        .secao-titulo { margin-top: 40px; border-bottom: 2px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand"><span>📝</span> ADMIN - ABRIR O.S.</div>
        <a href="index.html" class="back-link">Sair &rarr;</a>
    </nav>

    <div class="container">
        <div class="card-style">
            <h3 id="formTitulo" style="margin-top: 0; margin-bottom: 24px; font-size: 1.1rem;">Criar Nova Ordem de Serviço</h3>
            
            <div class="form-grid">
                <div>
                    <label>Código da O.S.</label>
                    <input type="text" id="codigoOS" class="custom-input" placeholder="Ex: OS-001">
                </div>
                <div>
                    <label>Solicitante</label>
                    <input type="text" id="solicitante" class="custom-input" placeholder="Nome do solicitante">
                </div>
                <div>
                    <label>Data Estipulada</label>
                    <input type="date" id="dataEstipulada" class="custom-input">
                </div>
                <div>
                    <label>Tipo de Serviço</label>
                    <select id="tipoServico" class="custom-input">
                        <option value="Elétrica">Elétrica</option>
                        <option value="Automação">Automação</option>
                        <option value="Montagem">Montagem</option>
                        <option value="Civil">Civil</option>
                        <option value="Manutenção">Manutenção</option>
                    </select>
                </div>
            </div>

            <label>Foto do Local <span id="fotoLabel" style="font-weight: normal; font-size: 0.8em;">(Opcional na edição)</span></label>
            <input type="file" id="fotoInput" class="custom-input" accept="image/*" style="margin-bottom: 20px; padding: 7px;">

            <label>Descrição do Serviço</label>
            <textarea id="descricao" class="custom-input" placeholder="Detalhes do que precisa ser feito..."></textarea>
            
            <button onclick="salvarOS()" id="btnSalvar" class="btn-primary">Criar Ordem de Serviço</button>
            <button onclick="cancelarEdicao()" id="btnCancelar" class="btn-primary btn-cancel" style="display: none;">Cancelar Edição</button>
            <p id="status"></p>
        </div>

        <div class="secao-titulo">
            <h3 style="margin: 0;">Gerenciar O.S. Abertas</h3>
            <span style="font-size: 0.8rem; color: var(--text-secondary);">Sincronizadas em ambos os bancos.</span>
        </div>

        <div class="filter-bar">
            <input type="text" id="buscaCodigo" class="custom-input" placeholder="Pesquisar por Código...">
            <select id="buscaTipo" class="custom-input">
                <option value="">Todos os Tipos</option>
                <option value="Elétrica">Elétrica</option>
                <option value="Automação">Automação</option>
                <option value="Montagem">Montagem</option>
                <option value="Civil">Civil</option>
                <option value="Manutenção">Manutenção</option>
            </select>
            <button onclick="aplicarFiltros()" class="btn-primary btn-filter">🔍 Buscar</button>
            <button onclick="limparFiltros()" class="btn-secondary btn-filter">Limpar</button>
        </div>

        <div id="lista" class="grid-os"></div>
        <button id="btnCarregarMais" onclick="carregarProximos()" class="btn-secondary" style="display: none;">Carregar Mais</button>
        <p id="msgFim" style="text-align:center; color: #64748b; display: none; font-size: 0.9rem; margin-top: 20px;">Todas carregadas.</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // Importando o "where" para habilitar os filtros de busca
        import { getFirestore, collection, getDocs, query, orderBy, limit, startAfter, doc, deleteDoc, updateDoc, setDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ==========================================
        // 1. CONFIGURAÇÕES DOS BANCOS DE DADOS
        // ==========================================
        const configMecanica = {
            apiKey: "AIzaSyAwBdNKVmujXM-icPXZllCYw4ED6ugSEK0",
            authDomain: "mecanica-699bb.firebaseapp.com",
            projectId: "mecanica-699bb",
            messagingSenderId: "223675812288",
            appId: "1:223675812288:web:f91f3dab6705fa7a2aa025",
            measurementId: "G-G78PR55F9F"
        };

        const configEletrica = {
            apiKey: "AIzaSyB_w4-z_onAEUf10ROfYCmvnm6Fkkp2sYo",
            authDomain: "eletrica-8c96e.firebaseapp.com",
            projectId: "eletrica-8c96e",
            storageBucket: "eletrica-8c96e.firebasestorage.app",
            messagingSenderId: "456815528430",
            appId: "1:456815528430:web:4cf873dc8071c9a2bbe6ff"
        };

        const appMecanica = initializeApp(configMecanica, "AppMecanica");
        const appEletrica = initializeApp(configEletrica, "AppEletrica");

        const dbMecanica = getFirestore(appMecanica);
        const dbEletrica = getFirestore(appEletrica);

        // ==========================================
        // 2. VARIÁVEIS GLOBAIS E UTILITÁRIOS
        // ==========================================
        let ultimoDocCarregado = null;
        const ITENS_POR_PAGINA = 6;
        let carregando = false;
        let idEdicao = null; 
        let fotoUrlAtual = ""; 

        const converterParaBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        // ==========================================
        // 3. LÓGICA DE FILTROS (PESQUISA)
        // ==========================================
        window.aplicarFiltros = function() {
            document.getElementById('lista').innerHTML = '';
            document.getElementById('msgFim').style.display = 'none';
            document.getElementById('btnCarregarMais').style.display = 'none';
            ultimoDocCarregado = null;
            carregarProximos();
        }

        window.limparFiltros = function() {
            document.getElementById('buscaCodigo').value = '';
            document.getElementById('buscaTipo').value = '';
            resetarLista();
        }

        // ==========================================
        // 4. LÓGICA PRINCIPAL (CRIAR/EDITAR NOS 2 BANCOS)
        // ==========================================
        window.salvarOS = async function() {
            const codigoOS = document.getElementById('codigoOS').value;
            const solicitante = document.getElementById('solicitante').value;
            const dataEstipulada = document.getElementById('dataEstipulada').value;
            const tipoServico = document.getElementById('tipoServico').value;
            const descricao = document.getElementById('descricao').value;
            const fileInput = document.getElementById('fotoInput');
            const file = fileInput.files[0];
            
            const btn = document.getElementById('btnSalvar');
            const status = document.getElementById('status');

            if (!codigoOS || !solicitante || !descricao) { alert("Preencha Código, Solicitante e Descrição!"); return; }
            if (!idEdicao && !file) { alert("Anexe uma foto do local!"); return; }
            if (file && file.size > 700 * 1024) { alert("Foto muito grande! Use < 700KB."); return; }

            try {
                btn.disabled = true;
                btn.innerText = idEdicao ? "Atualizando em ambos..." : "Salvando em ambos...";
                status.innerText = "";
                
                let fotoFinal = fotoUrlAtual; 
                if (file) fotoFinal = await converterParaBase64(file);

                const dados = {
                    codigoOS: codigoOS,
                    codigoBusca: codigoOS.toLowerCase(),
                    solicitante: solicitante,
                    dataEstipulada: dataEstipulada,
                    tipoServico: tipoServico,
                    descricao: descricao,
                    fotoUrl: fotoFinal,
                    dataAtualizacao: new Date()
                };

                if (!idEdicao) {
                    dados.status = "Pendente"; 
                    dados.dataCriacao = new Date();
                    
                    const novoDocRef = doc(collection(dbMecanica, "ordens_servico"));
                    const novoId = novoDocRef.id;

                    await setDoc(doc(dbMecanica, "ordens_servico", novoId), dados);
                    await setDoc(doc(dbEletrica, "ordens_servico", novoId), dados);
                    
                    status.style.color = "green"; status.innerText = "O.S. Sincronizada com sucesso!";
                    limparFormulario();
                } else {
                    await updateDoc(doc(dbMecanica, "ordens_servico", idEdicao), dados);
                    await updateDoc(doc(dbEletrica, "ordens_servico", idEdicao), dados);
                    
                    status.style.color = "blue"; status.innerText = "Atualizado em ambos os bancos!";
                    cancelarEdicao(); 
                }
                
                // Limpa os filtros ao salvar e mostra a lista atualizada
                limparFiltros();
            } catch (error) {
                console.error("Erro:", error); status.innerText = "Erro ao salvar.";
            } finally {
                btn.disabled = false;
                if (!idEdicao) btn.innerText = "Criar Ordem de Serviço";
                setTimeout(() => status.innerText = "", 3000);
            }
        }

        // ==========================================
        // 5. EDIÇÃO E EXCLUSÃO
        // ==========================================
        window.editarItem = function(id, dataString) {
            const data = JSON.parse(dataString);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            document.getElementById('codigoOS').value = data.codigoOS;
            document.getElementById('solicitante').value = data.solicitante;
            document.getElementById('dataEstipulada').value = data.dataEstipulada;
            document.getElementById('tipoServico').value = data.tipoServico;
            document.getElementById('descricao').value = data.descricao;
            
            idEdicao = id; 
            fotoUrlAtual = data.fotoUrl;

            document.getElementById('formTitulo').innerText = "Editando O.S: " + data.codigoOS;
            document.getElementById('btnSalvar').innerText = "Salvar Alterações";
            document.getElementById('btnSalvar').style.backgroundColor = "#f59e0b";
            document.getElementById('btnCancelar').style.display = "block";
            document.getElementById('fotoLabel').innerText = "(Deixe vazio para manter a foto atual)";
        }

        window.cancelarEdicao = function() {
            idEdicao = null; fotoUrlAtual = "";
            limparFormulario();
            document.getElementById('formTitulo').innerText = "Criar Nova Ordem de Serviço";
            document.getElementById('btnSalvar').innerText = "Criar Ordem de Serviço";
            document.getElementById('btnSalvar').style.backgroundColor = ""; 
            document.getElementById('btnCancelar').style.display = "none";
            document.getElementById('fotoLabel').innerText = "(Opcional na edição)";
        }

        window.excluirItem = async function(id, codigoOS) {
            if (confirm(`Tem certeza que deseja excluir a ${codigoOS} de AMBOS os bancos?`)) {
                try {
                    await deleteDoc(doc(dbMecanica, "ordens_servico", id));
                    await deleteDoc(doc(dbEletrica, "ordens_servico", id));
                    
                    alert("O.S. excluída dos dois sistemas!"); 
                    aplicarFiltros(); // Recarrega a lista respeitando filtros atuais
                } catch (error) { 
                    console.error(error); 
                    alert("Erro ao excluir."); 
                }
            }
        }

        // ==========================================
        // 6. CARREGAMENTO E RENDERIZAÇÃO
        // ==========================================
        window.carregarProximos = async function() {
            if (carregando) return;
            carregando = true;
            
            const btnMais = document.getElementById('btnCarregarMais');
            const msgFim = document.getElementById('msgFim');
            
            const codigoFiltro = document.getElementById('buscaCodigo').value.trim().toLowerCase();
            const tipoFiltro = document.getElementById('buscaTipo').value;
            let temFiltroAtivo = codigoFiltro !== '' || tipoFiltro !== '';

            if(btnMais && !temFiltroAtivo) btnMais.innerText = "Carregando...";

            try {
                let q;
                const colRef = collection(dbMecanica, "ordens_servico");
                let restricoes = [];

                // Verifica se há texto no campo código (pesquisa por prefixo)
                if (codigoFiltro) {
                    restricoes.push(where("codigoBusca", ">=", codigoFiltro));
                    restricoes.push(where("codigoBusca", "<=", codigoFiltro + '\uf8ff'));
                } 
                // Se não tiver código, mas tiver tipo, pesquisa por tipo
                else if (tipoFiltro) {
                    restricoes.push(where("tipoServico", "==", tipoFiltro));
                }

                if (!temFiltroAtivo) {
                    // Carregamento normal com paginação
                    if (!ultimoDocCarregado) {
                        q = query(colRef, orderBy("dataCriacao", "desc"), limit(ITENS_POR_PAGINA));
                    } else {
                        q = query(colRef, orderBy("dataCriacao", "desc"), startAfter(ultimoDocCarregado), limit(ITENS_POR_PAGINA));
                    }
                } else {
                    // Carregamento com filtros (Limitamos a 50 itens para não pesar e retiramos o orderBy para não exigir Index no Firebase)
                    q = query(colRef, ...restricoes, limit(50));
                }

                const snapshot = await getDocs(q);
                
                let docsArray = [];
                snapshot.forEach((docSnap) => {
                    docsArray.push({ id: docSnap.id, data: docSnap.data() });
                });

                // Se houver filtros, ordenamos pela data da mais recente pra mais antiga diretamente no navegador
                if (temFiltroAtivo) {
                    docsArray.sort((a, b) => {
                        let timeA = a.data.dataCriacao ? a.data.dataCriacao.toMillis() : 0;
                        let timeB = b.data.dataCriacao ? b.data.dataCriacao.toMillis() : 0;
                        return timeB - timeA;
                    });
                }

                if (docsArray.length === 0) {
                    if(btnMais) btnMais.style.display = "none";
                    if(msgFim) {
                        msgFim.innerText = temFiltroAtivo ? "Nenhuma O.S. encontrada para este filtro." : "Todas carregadas.";
                        msgFim.style.display = "block";
                    }
                    carregando = false; return;
                } else {
                    if(msgFim) msgFim.style.display = "none";
                }

                // Renderiza os cards
                docsArray.forEach(item => criarCard(item.id, item.data));

                // Lida com o botão "Carregar Mais"
                if (temFiltroAtivo) {
                    // Na pesquisa, mostramos os resultados sem botão de carregar mais para simplificar
                    if(btnMais) btnMais.style.display = "none";
                } else {
                    ultimoDocCarregado = snapshot.docs[snapshot.docs.length - 1];
                    if (snapshot.docs.length < ITENS_POR_PAGINA) {
                        if(btnMais) btnMais.style.display = "none";
                        if(msgFim) {
                            msgFim.innerText = "Todas carregadas.";
                            msgFim.style.display = "block";
                        }
                    } else {
                        if(btnMais) { btnMais.style.display = "block"; btnMais.innerText = "Carregar Mais"; }
                    }
                }
            } catch (error) { console.error("Erro:", error); } 
            finally { carregando = false; }
        }

        function resetarLista() {
            document.getElementById('lista').innerHTML = '';
            document.getElementById('msgFim').style.display = 'none';
            document.getElementById('btnCarregarMais').style.display = 'none';
            ultimoDocCarregado = null; 
            carregarProximos();
        }

        function criarCard(id, data) {
            const div = document.createElement('div');
            div.className = 'item-card';
            
            const badgeClass = data.status === 'Concluída' ? 'badge-concluida' : 'badge-pendente';
            const dataString = JSON.stringify(data).replace(/"/g, '&quot;');
            
            div.innerHTML = `
                <h4>${data.codigoOS}</h4>
                <p style="font-size: 0.8rem; margin: -5px 0 10px 0; color: var(--primary);"><strong>${data.tipoServico}</strong></p>
                <div><span class="badge ${badgeClass}">${data.status}</span></div>
                <p><strong>Solicitante:</strong> ${data.solicitante}</p>
                <div class="card-actions">
                    <button class="action-btn btn-edit" onclick='editarItem("${id}", "${dataString}")'>Editar</button>
                    <button class="action-btn btn-delete" onclick='excluirItem("${id}", "${data.codigoOS}")'>Excluir</button>
                </div>
            `;
            document.getElementById('lista').appendChild(div);
        }

        function limparFormulario() {
            document.getElementById('codigoOS').value = '';
            document.getElementById('solicitante').value = '';
            document.getElementById('dataEstipulada').value = '';
            document.getElementById('tipoServico').value = 'Elétrica';
            document.getElementById('descricao').value = '';
            document.getElementById('fotoInput').value = '';
        }

        // Inicializa
        resetarLista();
    </script>
</body>
</html>
